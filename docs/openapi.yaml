openapi: "3.0.3"
info:
  title: API do Hub de Eventos Financeiros
  version: 1.0.0
  description: API para ingestão de transações no Financial Event Hub
paths:
  /v1/transactions:
    post:
      summary: Cria uma transação e publica evento assíncrono
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave de idempotência fornecida pelo cliente
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoTransacao'
            examples:
              exemplo-valido:
                summary: Exemplo de requisição válida
                value:
                  account_id: "123456325349475439"
                  amount: 150.75
                  currency: "BRL"
                  description: "Pagamento fatura"
      responses:
        '201':
          description: Transação aceita para processamento assíncrono
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransacaoCriada'
        '202':
          description: Aceito (processamento em segundo plano)
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Conflito - transação duplicada (idempotência)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
components:
  schemas:
    RequisicaoTransacao:
      title: Requisição de Transação
      type: object
      required:
        - account_id
        - amount
        - currency
      properties:
        account_id:
          type: string
          description: Identificador da conta do cliente
        amount:
          type: number
          format: double
          description: Valor da transação (pode ser positivo/negativo conforme tipo)
        currency:
          type: string
          description: Código ISO 4217 da moeda (ex: BRL, USD)
          pattern: '^[A-Z]{3}$'
    TransacaoCriada:
      type: object
      properties:
        transaction_id:
          type: string
          description: Identificador único criado pelo Hub (UUID)
        status:
          type: string
          description: Estado inicial (ex: PENDING)
      required: [transaction_id, status]
    Erro:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]
    RequisicaoErroExample:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      example:
        code: INVALID_REQUEST
        message: Dados inválidos no payload

  parameters:
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Chave de idempotência do cliente (obrigatória)

  securitySchemes: {}
